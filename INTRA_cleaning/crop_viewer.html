<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>msil.png — Crop Cleaning Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg:        #0d0f14;
      --surface:   #161920;
      --card:      #1c2030;
      --border:    #2a2f42;
      --accent:    #4f8ef7;
      --accent2:   #2ecc8a;
      --warn:      #f7a23e;
      --text:      #e4e8f5;
      --muted:     #6b7394;
      --tag-bg:    #1e2540;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,15,20,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    header h1 {
      font-size: 1.1rem; font-weight: 600;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    header .subtitle { font-size:.75rem; color: var(--muted); }

    .controls {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-left: auto;
    }
    .search-wrap {
      position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--muted); width:15px; height:15px;
    }
    #search {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px;
      padding: 7px 12px 7px 32px; font-size: .82rem;
      font-family: 'Inter', sans-serif;
      width: 210px; outline: none;
      transition: border-color .2s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    .btn-group { display: flex; gap: 4px; }
    .view-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); border-radius: 7px;
      padding: 6px 13px; font-size: .78rem; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all .15s;
    }
    .view-btn:hover { color: var(--text); border-color: var(--accent); }
    .view-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .stat-pill {
      background: var(--tag-bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px;
      font-size: .75rem; color: var(--muted);
    }
    .stat-pill span { color: var(--accent); font-weight: 600; }

    /* ── Main grid ──────────────────────────────────────── */
    main { padding: 24px 28px; }

    #grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    }
    #grid.large { grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); }
    #grid.list  { grid-template-columns: 1fr; }

    /* ── Card ───────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,.5);
      border-color: var(--accent);
    }

    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .crop-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem; color: var(--muted);
    }
    .crop-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .88rem; font-weight: 500; color: var(--accent2);
    }
    .erase-badge {
      font-size: .68rem; padding: 2px 8px; border-radius: 10px;
      font-weight: 600;
    }
    .erase-badge.none { background: #1a2a1a; color: #4caf50; }
    .erase-badge.low  { background: #2a2010; color: var(--warn); }
    .erase-badge.high { background: #2a1510; color: #ff6b6b; }

    /* ── Comparison area ────────────────────────────────── */
    .compare {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .compare .half {
      display: flex; flex-direction: column;
    }
    .compare .half + .half {
      border-left: 1px solid var(--border);
    }
    .half-label {
      font-size: .65rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted);
      padding: 6px 10px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .half-label.orig { color: #888; }
    .half-label.clean { color: var(--accent2); }

    .img-wrap {
      display: flex; align-items: center; justify-content: center;
      background: #f8f8f8;
      min-height: 80px; padding: 8px;
      position: relative; overflow: hidden;
    }
    .img-wrap img {
      max-width: 100%; max-height: 180px;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
    }
    .img-wrap.missing {
      background: var(--surface);
      color: var(--muted); font-size: .75rem;
      justify-content: center; align-items: center;
      height: 80px;
    }

    /* ── Slider mode ────────────────────────────────────── */
    .card.slider-mode .compare { display: none; }
    .slider-container {
      display: none;
      position: relative; overflow: hidden;
      background: #f8f8f8;
      cursor: col-resize;
      user-select: none;
      min-height: 100px;
    }
    .card.slider-mode .slider-container { display: block; }
    .slider-container .sl-img {
      width: 100%; display: block;
      max-height: 260px; object-fit: contain;
      image-rendering: pixelated;
    }
    .slider-container .sl-clean {
      position: absolute; inset: 0;
      overflow: hidden;
      width: 50%;
    }
    .slider-container .sl-clean img {
      width: 100%; display: block;
      max-height: 260px; object-fit: contain;
      image-rendering: pixelated;
      position: absolute; left: 0; top: 0;
    }
    .slider-handle {
      position: absolute; top: 0; bottom: 0;
      width: 2px; background: var(--accent);
      cursor: col-resize; z-index: 10;
      left: 50%;
    }
    .slider-handle::after {
      content: '◀ ▶';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: var(--accent); color: #fff;
      font-size: .6rem; padding: 3px 6px; border-radius: 8px;
      white-space: nowrap; pointer-events: none;
    }
    .slider-labels {
      position: absolute; bottom: 6px;
      display: flex; width: 100%;
      justify-content: space-between;
      padding: 0 10px; pointer-events: none;
    }
    .slider-labels span {
      font-size: .6rem; font-weight: 700;
      background: rgba(0,0,0,.55); color: #fff;
      padding: 2px 6px; border-radius: 4px;
    }

    /* toggle button per card */
    .card-footer {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .toggle-mode {
      font-size: .7rem; padding: 3px 10px; border-radius: 6px;
      background: var(--tag-bg); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all .15s;
    }
    .toggle-mode:hover { color: var(--accent); border-color: var(--accent); }
    .dim-info {
      font-size: .68rem; color: var(--muted); margin-left: auto;
    }

    /* ── Empty state ────────────────────────────────────── */
    #empty {
      display: none; text-align: center;
      padding: 80px 20px; color: var(--muted); font-size: .9rem;
    }

    /* ── Scrollbar ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

// ── Render ─────────────────────────────────────────────────────────────────────
const grid   = document.getElementById('grid');
const search = document.getElementById('search');
const shownEl= document.getElementById('shown');
const totalEl= document.getElementById('total');
totalEl.textContent = CROPS.length;

function badge(erased) {
  if (erased === 0) return `<span class="erase-badge none">no lines</span>`;
  if (erased < 1000) return `<span class="erase-badge low">${erased.toLocaleString()} px</span>`;
  return `<span class="erase-badge high">${erased.toLocaleString()} px</span>`;
}

function buildCard(c) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.label = c.label.toLowerCase();
  div.innerHTML = `
    <div class="card-header">
      <span class="crop-id">#${String(c.idx).padStart(3,'0')}</span>
      <span class="crop-label">${c.label}</span>
      ${badge(c.erased)}
    </div>
    <div class="compare">
      <div class="half">
        <div class="half-label orig">Original</div>
        <div class="img-wrap"><img src="${c.orig}" alt="original" loading="lazy" /></div>
      </div>
      <div class="half">
        <div class="half-label clean">Cleaned</div>
        <div class="img-wrap"><img src="${c.clean}" alt="cleaned" loading="lazy" /></div>
      </div>
    </div>
    <div class="slider-container">
      <img class="sl-img" src="${c.orig}" alt="original" />
      <div class="sl-clean">
        <img src="${c.clean}" alt="cleaned" />
      </div>
      <div class="slider-handle"></div>
      <div class="slider-labels">
        <span>Original</span><span>Cleaned</span>
      </div>
    </div>
    <div class="card-footer">
      <button class="toggle-mode">⇔ Slider mode</button>
      <span class="dim-info">${c.w}×${c.h} px · erased ${c.erased.toLocaleString()} px</span>
    </div>
  `;

  // Toggle side-by-side ↔ slider
  const btn = div.querySelector('.toggle-mode');
  btn.addEventListener('click', () => {
    div.classList.toggle('slider-mode');
    btn.textContent = div.classList.contains('slider-mode') ? '⊞ Side by side' : '⇔ Slider mode';
  });

  // Slider drag
  const sliderContainer = div.querySelector('.slider-container');
  const handle          = div.querySelector('.slider-handle');
  const cleanDiv        = div.querySelector('.sl-clean');
  let dragging = false;

  function setSlider(x) {
    const rect = sliderContainer.getBoundingClientRect();
    let pct = (x - rect.left) / rect.width;
    pct = Math.max(0.02, Math.min(0.98, pct));
    cleanDiv.style.width  = `${(1 - pct) * 100}%`;
    cleanDiv.style.left   = `${pct * 100}%`;
    cleanDiv.querySelector('img').style.marginLeft = `-${pct * rect.width}px`;
    handle.style.left = `${pct * 100}%`;
  }

  sliderContainer.addEventListener('mousedown', e => { dragging = true; setSlider(e.clientX); });
  window.addEventListener('mousemove', e => { if (dragging) setSlider(e.clientX); });
  window.addEventListener('mouseup',   () => { dragging = false; });
  sliderContainer.addEventListener('touchstart', e => setSlider(e.touches[0].clientX), {passive:true});
  sliderContainer.addEventListener('touchmove',  e => setSlider(e.touches[0].clientX), {passive:true});

  return div;
}

// Render all
function render(filter = '') {
  grid.innerHTML = '';
  let count = 0;
  CROPS.forEach(c => {
    if (filter && !c.label.toLowerCase().includes(filter)) return;
    grid.appendChild(buildCard(c));
    count++;
  });
  shownEl.textContent = count;
  document.getElementById('empty').style.display = count === 0 ? 'block' : 'none';
}

render();

// Search
search.addEventListener('input', () => render(search.value.trim().toLowerCase()));

// View size toggle
document.querySelectorAll('.view-btn[data-size]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn[data-size]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    grid.className = btn.dataset.size === 'normal' ? '' :
                     btn.dataset.size === 'large'  ? 'large' : 'list';
    grid.id = 'grid';
  });
});
</script>
